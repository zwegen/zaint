apply plugin: 'com.android.library'
apply plugin: 'com.getkeepsafe.dexcount'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

apply from: 'gradle/code_quality_tasks.gradle'

android {
    namespace 'de.zwegen.zpaint'
    compileSdkVersion rootProject.ext.androidCompileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.androidMinSdkVersion
        targetSdkVersion rootProject.ext.androidTargetSdkVersion
        versionCode rootProject.ext.androidVersionCode
        versionName rootProject.ext.androidVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        signedRelease {
        }
        debug {
            // Required by the debug manifest's MultiDexApplication.
            multiDexEnabled true
        }
    }

    lintOptions {
        // specific ignores should be defined via lint.xml file
        lintConfig file('config/lint.xml')
        ignore 'ClickableViewAccessibility', 'StaticFieldLeak', 'GradleDependency', 'OldTargetApi', 'LintBaseline'
        textReport true
        xmlReport true
        htmlReport true
        xmlOutput file("build/reports/lint-report.xml")
        htmlOutput file("build/reports/lint-report.html")
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', "**/attach_hotspot_windows.dll"]
            merges += ['META-INF/licenses/ASM']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation project(':colorpicker')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.esotericsoftware:kryo:5.6.2'
    implementation 'id.zelory:compressor:3.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'org.boofcv:boofcv-ip:1.2.2'
    implementation 'org.boofcv:boofcv-feature:1.2.2'

    debugImplementation 'androidx.multidex:multidex:2.0.1'

    implementation 'androidx.test.espresso:espresso-idling-resource:3.5.1'
}

tasks.withType(Javadoc).all {
    enabled = false
}

if (project.hasProperty('jenkins')) {
    android.dexOptions.preDexLibraries = false
}
